name: Setup build tools
description: Install the repository's Node, pnpm, Go and optional Wails CLI versions
inputs:
  wails:
    description: Install the Wails CLI pinned in go.mod
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install pinned pnpm
      shell: bash
      run: |
        package_manager=$(node -p "require('./frontend/package.json').packageManager")
        npm install --global "$package_manager"
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache: true
    - name: Install matching Wails CLI
      if: inputs.wails == 'true'
      shell: bash
      run: |
        wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails_version"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
