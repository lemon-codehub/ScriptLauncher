name: 功能建议
description: 分享使用场景或改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？
      description: 描述使用场景，而不只是一个功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的交互和替代方案
      description: 如有平台差异，请说明希望支持的系统。
